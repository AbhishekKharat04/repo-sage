name: ShipSage CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  DOCKER_IMAGE: abhishekkharat04/shipsage

jobs:
  # ── Stage 1: Lint & Test ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff black

      - name: Lint with ruff
        run: ruff check . --select E,F,W --ignore E501
        continue-on-error: true

      - name: Check code formatting
        run: black --check .
        continue-on-error: true

      - name: Run tests
        run: |
          # Create tests directory if it doesn't exist
          mkdir -p tests
          # Run pytest if tests exist
          if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            pytest tests/ -v
          else
            echo "No tests found - skipping test execution"
          fi

  # ── Stage 2: Build Docker Image ──
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ── Stage 3: Deploy (Optional - configure based on your platform) ──
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Example: Deploy to Railway
      # - name: Deploy to Railway
      #   run: |
      #     curl -X POST ${{ secrets.RAILWAY_WEBHOOK_URL }}

      # Example: Deploy to Fly.io
      # - name: Deploy to Fly.io
      #   uses: superfly/flyctl-actions/setup-flyctl@master
      # - run: flyctl deploy --remote-only
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Example: Deploy to AWS ECS
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      #
      # - name: Deploy to ECS
      #   run: |
      #     aws ecs update-service --cluster shipsage-cluster --service shipsage-service --force-new-deployment

      - name: Deployment placeholder
        run: |
          echo "✅ Docker image built and pushed successfully"
          echo "🚀 Configure deployment in this step based on your platform"
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}:latest"

  # ── Stage 4: Smoke Tests ──
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          # Replace with your actual deployment URL
          # curl -f https://shipsage.example.com/health || exit 1
          echo "⚠️ Configure health check URL in workflow"
          echo "✅ Smoke test placeholder passed"

